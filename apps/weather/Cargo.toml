[package]
name = "nixe-weather"
version = "0.1.0"
description = "Weather for Omarchy: current conditions, hourly and 7-day forecasts, air quality, and bar integration"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nixe-weather"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
nixe-weather-core = { path = "../../crates/nixe-weather-core" }
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
